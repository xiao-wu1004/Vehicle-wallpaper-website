spring.datasource.url=jdbc:h2:mem:vehiclewallpaper;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.jpa.open-in-view=false
app.catalog.sync-on-startup=true
app.admin.security.api-key=test-admin-key
app.admin.security.login-username=test-admin
app.admin.security.login-password=test-admin-password
app.admin.security.token-secret=test-admin-token-secret
