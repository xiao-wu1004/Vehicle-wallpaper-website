spring.application.name=vehicle-wallpaper-backend
server.port=${PORT:8080}
spring.profiles.active=${APP_PROFILE:h2}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jackson.time-zone=Asia/Shanghai
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

app.frontend.root-path=${APP_FRONTEND_ROOT_PATH:../}
app.catalog.root-path=${APP_CATALOG_ROOT_PATH:../cars}
app.catalog.sync-on-startup=${APP_CATALOG_SYNC_ON_STARTUP:false}
app.storage.mode=${APP_STORAGE_MODE:filesystem}
app.storage.s3-endpoint=${APP_STORAGE_S3_ENDPOINT:}
app.storage.s3-region=${APP_STORAGE_S3_REGION:ap-northeast-1}
app.storage.s3-bucket=${APP_STORAGE_S3_BUCKET:}
app.storage.s3-access-key=${APP_STORAGE_S3_ACCESS_KEY:}
app.storage.s3-secret-key=${APP_STORAGE_S3_SECRET_KEY:}
app.storage.s3-key-prefix=${APP_STORAGE_S3_KEY_PREFIX:}
app.storage.s3-public-base-url=${APP_STORAGE_S3_PUBLIC_BASE_URL:}
app.storage.s3-path-style-access=${APP_STORAGE_S3_PATH_STYLE_ACCESS:false}
app.admin.security.header-name=X-Admin-API-Key
app.admin.security.api-key=${ADMIN_API_KEY:}
app.admin.security.login-username=${ADMIN_USERNAME:}
app.admin.security.login-password=${ADMIN_PASSWORD:}
app.admin.security.login-display-name=${ADMIN_DISPLAY_NAME:Platform Admin}
app.admin.security.token-secret=${ADMIN_TOKEN_SECRET:}
app.admin.security.token-ttl-hours=${ADMIN_TOKEN_TTL_HOURS:12}
app.admin.security.max-failed-attempts=${ADMIN_MAX_FAILED_ATTEMPTS:5}
app.admin.security.lock-minutes=${ADMIN_LOCK_MINUTES:15}
app.user.auth.token-secret=${USER_AUTH_TOKEN_SECRET:}
app.user.auth.token-ttl-hours=${USER_AUTH_TOKEN_TTL_HOURS:168}
