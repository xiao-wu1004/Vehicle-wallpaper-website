spring.application.name=vehicle-wallpaper-backend
server.port=${PORT:8080}
spring.profiles.active=${APP_PROFILE:h2}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jackson.time-zone=Asia/Shanghai
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

app.frontend.root-path=${APP_FRONTEND_ROOT_PATH:../}
app.catalog.root-path=${APP_CATALOG_ROOT_PATH:../cars}
app.catalog.sync-on-startup=${APP_CATALOG_SYNC_ON_STARTUP:true}
app.admin.security.header-name=X-Admin-API-Key
app.admin.security.api-key=${ADMIN_API_KEY:}
app.admin.security.login-username=${ADMIN_USERNAME:}
app.admin.security.login-password=${ADMIN_PASSWORD:}
app.admin.security.token-secret=${ADMIN_TOKEN_SECRET:}
app.admin.security.token-ttl-hours=${ADMIN_TOKEN_TTL_HOURS:12}
