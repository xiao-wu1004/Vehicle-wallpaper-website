spring.application.name=vehicle-wallpaper-backend
server.port=8080
spring.profiles.active=${APP_PROFILE:h2}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jackson.time-zone=Asia/Shanghai
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

app.frontend.root-path=../
app.catalog.root-path=../cars
app.catalog.sync-on-startup=true
app.admin.security.header-name=X-Admin-API-Key
app.admin.security.api-key=${ADMIN_API_KEY:}
