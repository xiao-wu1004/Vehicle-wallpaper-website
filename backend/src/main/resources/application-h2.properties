spring.datasource.url=jdbc:h2:file:./data/vehicle-wallpaper-dev;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 本地开发默认管理员（生产环境用环境变量 ADMIN_USERNAME / ADMIN_PASSWORD 覆盖）
app.admin.security.login-username=admin
app.admin.security.login-password=VehicleWallpaper@2024
app.admin.security.login-display-name=平台管理员
app.admin.security.token-secret=dev-secret-change-in-production

# 用户认证 Token 密钥（生产用环境变量 USER_AUTH_TOKEN_SECRET）
app.user.auth.token-secret=dev-user-auth-secret
